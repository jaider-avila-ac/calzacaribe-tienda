server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # GIS popup comunica la credencial a esta ventana mediante window.opener.
    # "same-origin" sin esta excepción puede dejar el popup de Google en blanco.
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

    # El backend (contenedor "api") vive en la MISMA red interna de Docker ("coolify"), así que
    # se le llama directo por su alias ahí (api:8080, sin TLS) en vez de por su dominio público
    # (manzana.calzacaribe.com). Esto importa, y no es solo una optimización: salir al dominio
    # público significa volver a pasar por Traefik, y Traefik NO confía en el X-Forwarded-Host
    # que este nginx intenta poner — lo pisa con el suyo (el Host real de ESE segundo salto,
    # manzana.calzacaribe.com) — así que el backend nunca se enteraba del dominio real de la
    # tienda y el header de abajo quedaba sin efecto (confirmado en vivo: con la versión anterior
    # de este archivo /sitemap.xml ya no resolvía ningún tenant). Por la red interna no hay
    # Traefik de por medio, así que el header SÍ llega intacto.
    # "set" + "resolver" fuerza resolución DNS en tiempo de request (DNS embebido de Docker,
    # 127.0.0.11 — es quien conoce el alias "api") en vez de solo al arrancar nginx, para que no
    # falle si el contenedor del backend tarda en estar listo o cambia de IP al redesplegar.
    resolver 127.0.0.11 valid=30s;

    # El sitemap lo genera el backend (dato en vivo — aparece un producto nuevo sin esperar
    # rebuild/deploy del frontend), pero tiene que quedar servido desde este mismo dominio:
    # Google solo acepta URLs de un sitemap si son del mismo host donde vive el archivo, salvo un
    # cross-submit verificado en Search Console.
    location = /sitemap.xml {
        set $sitemap_backend "http://api:8080/api/v1/public/sitemap.xml";
        proxy_pass $sitemap_backend;
        # X-Forwarded-Host lleva el Host ORIGINAL del navegador ($host = el de ESTA solicitud
        # entrante) — es lo que TenantInterceptor usa para resolver la tienda por dominio en vez
        # de asumir un tenant fijo (PLAN_MEJORAS_API_ECOMMERCE_MULTITENANT.md §5).
        proxy_set_header X-Forwarded-Host $host;
    }

    # Toda la API pasa por acá en vez de ir directo al backend compartido desde el navegador
    # (cross-origin). Antes VITE_API_URL apuntaba directo a manzana.calzacaribe.com: como ninguna
    # tienda llamaba a su propio dominio para hablar con el backend, TenantInterceptor nunca
    # podía resolver el tenant por dominio y caía al respaldo — el header X-Tenant-Id, que pone
    # el propio cliente y cualquiera puede cambiar con curl para ver el catálogo de OTRA tienda
    # sin pasar por su dominio. Proxeando acá, el backend recibe el Host real de esta tienda y
    # resuelve el tenant por dominio de verdad, como ya estaba pensado.
    location /api/ {
        set $api_backend "http://api:8080";
        proxy_pass $api_backend;
        proxy_set_header X-Forwarded-Host $host;
    }

    # WebSocket de notificaciones (SockJS/STOMP) — mismo motivo que /api/ de arriba.
    location /ws {
        set $ws_backend "http://api:8080";
        proxy_pass $ws_backend;
        proxy_set_header X-Forwarded-Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires 7d;
        add_header Cache-Control "public, must-revalidate";
    }
}
