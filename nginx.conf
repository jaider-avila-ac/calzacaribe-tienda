server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # GIS popup comunica la credencial a esta ventana mediante window.opener.
    # "same-origin" sin esta excepción puede dejar el popup de Google en blanco.
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

    # El sitemap lo genera el backend (dato en vivo — aparece un producto nuevo sin
    # esperar rebuild/deploy del frontend), pero tiene que quedar servido desde este
    # mismo dominio: Google solo acepta URLs de un sitemap si son del mismo host donde
    # vive el archivo, salvo un cross-submit verificado en Search Console.
    # "set" + "resolver" fuerza resolución DNS en tiempo de request (DNS embebido de
    # Docker) en vez de solo al arrancar nginx, para que no falle si el contenedor del
    # backend tarda en estar listo.
    location = /sitemap.xml {
        resolver 127.0.0.11 valid=30s;
        set $sitemap_backend "https://manzana.calzacaribe.com/api/v1/public/sitemap.xml";
        proxy_pass $sitemap_backend;
        proxy_ssl_server_name on;
        proxy_set_header Host manzana.calzacaribe.com;
        # Host queda reescrito arriba (necesario para el ruteo TLS/SNI hacia el backend
        # compartido), así que el backend ya no puede saber desde qué dominio real llegó
        # esta solicitud a través de él. X-Forwarded-Host lleva el Host ORIGINAL del
        # navegador ($host = el de ESTA solicitud entrante, antes del override de arriba) —
        # es lo que TenantInterceptor usa para resolver la tienda por dominio en vez de
        # asumir un tenant fijo (PLAN_MEJORAS_API_ECOMMERCE_MULTITENANT.md §5).
        proxy_set_header X-Forwarded-Host $host;
    }

    # Toda la API pasa por acá en vez de ir directo al backend compartido desde el navegador
    # (cross-origin). Antes VITE_API_URL apuntaba directo a manzana.calzacaribe.com: el Host que
    # veía el backend en ESA conexión era el del backend mismo (nadie llama a tienda.calzacaribe.com
    # para resolver el tenant), así que el dominio nunca coincidía con ningún registro y
    # TenantInterceptor caía al respaldo — el header X-Tenant-Id, que pone el propio cliente y
    # cualquiera puede cambiar con curl para ver el catálogo de OTRA tienda sin pasar por su
    # dominio. Proxeando acá, el backend ve el Host real de esta tienda (vía X-Forwarded-Host) y
    # resuelve el tenant por dominio de verdad, como ya estaba pensado.
    location /api/ {
        resolver 127.0.0.11 valid=30s;
        set $api_backend "https://manzana.calzacaribe.com";
        proxy_pass $api_backend;
        proxy_ssl_server_name on;
        proxy_set_header Host manzana.calzacaribe.com;
        proxy_set_header X-Forwarded-Host $host;
    }

    # WebSocket de notificaciones (SockJS/STOMP) — mismo motivo que /api/ de arriba.
    location /ws {
        resolver 127.0.0.11 valid=30s;
        set $ws_backend "https://manzana.calzacaribe.com";
        proxy_pass $ws_backend;
        proxy_ssl_server_name on;
        proxy_set_header Host manzana.calzacaribe.com;
        proxy_set_header X-Forwarded-Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires 7d;
        add_header Cache-Control "public, must-revalidate";
    }
}
